name: build

# The build is the only instance allowed to write dist/ and docs/. CI proves
# two things: the committed dist state matches the curation, and two runs
# produce byte-identical output. No watch here — it needs network access to
# the source registries and is therefore run by hand.

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python tools/build.py

      - name: Committed output matches the curation
        run: git diff --exit-code dist/ docs/

      - name: Second run is byte-identical
        run: |
          cp dist/sigel.json /tmp/sigel.json
          cp dist/SIGEL.md /tmp/SIGEL.md
          cp docs/index.html /tmp/index.html
          cp docs/de.html /tmp/de.html
          python tools/build.py
          cmp /tmp/sigel.json dist/sigel.json
          cmp /tmp/SIGEL.md dist/SIGEL.md
          cmp /tmp/index.html docs/index.html
          cmp /tmp/de.html docs/de.html
