name: intake-guard

# The guard rail of the automatic ingest, enforced rather than promised. The
# intake routine works on a branch and opens a pull request; that request is
# merged only when this guard and the build are green. The guard reads the
# diff against the base and refuses everything the routine is not allowed to
# create — independently of what its task text says.

on:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard compares against the merge base, so it needs the history
          # of both sides, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test of the guard rail
        run: python tools/intake_guard.py --selbsttest

      - name: Check the diff against the base
        env:
          BASIS: ${{ github.event.pull_request.base.sha }}
          SPITZE: ${{ github.event.pull_request.head.sha }}
        run: python tools/intake_guard.py --basis "$BASIS" --spitze "$SPITZE"
