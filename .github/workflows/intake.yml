name: intake-vorpruefung

# The Action checks, it does not admit. It determines deterministically
# whether the report is complete and within its length limits, whether the
# named source carries the short form verbatim, and whether that source is on
# the curated trusted-source list — and posts the outcome as an **artifact**:
# a bot comment carrying the marker `<!-- intake-artefakt v1 -->` and the check
# result as JSON. Nothing is written to the registry.
#
# The artifact is the only input of the daily intake routine
# (tools/routine-intake.md). The routine never reads the issue text itself:
# that text is attacker-controlled, while the artifact is syntax-checked,
# length-limited and verified at the source.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  vorpruefung:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'sigel-meldung') ||
       startsWith(github.event.issue.title, '[sigel] '))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make PDF sources readable
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Pre-check
        env:
          # The issue body is foreign text and reaches the script only through
          # the environment — never interpolated into a shell line.
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python tools/intake.py --vorpruefung --ergebnis ergebnis.json

      - name: Read the result
        id: ergebnis
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          e = json.load(open("ergebnis.json", encoding="utf-8"))
          print("entscheidung=" + e["entscheidung"])
          print("label=" + (e["label"] or ""))
          print("schliessen=" + str(e["schliessen"]).lower())
          with open("kommentar.md", "w", encoding="utf-8") as f:
              f.write(e["kommentar"])
          PY

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create vorgeprueft-ok --color 0E8A16 \
            --description "Pre-check passed; admission by the intake routine" || true
          gh label create abgelehnt --color B60205 \
            --description "Report does not meet the admission rule" || true
          gh label create wartet-maintainer --color FBCA04 \
            --description "Decision rests with the maintainer" || true

      - name: Post the artifact to the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMMER: ${{ github.event.issue.number }}
          LABEL: ${{ steps.ergebnis.outputs.label }}
          SCHLIESSEN: ${{ steps.ergebnis.outputs.schliessen }}
        run: |
          gh issue comment "$NUMMER" --body-file kommentar.md
          gh issue edit "$NUMMER" \
            --remove-label vorgeprueft-ok \
            --remove-label wartet-maintainer \
            --remove-label abgelehnt || true
          if [ -n "$LABEL" ]; then
            gh issue edit "$NUMMER" --add-label "$LABEL"
          fi
          if [ "$SCHLIESSEN" = "true" ]; then
            gh issue close "$NUMMER" --reason "not planned"
          fi

  # Trusted-source proposals are touched by no automation at all — not even a
  # pre-check. Whoever controls the trusted sources controls the registry, so
  # the maintainer works this layer in a session of his own. The Action does
  # nothing here but label.
  pruefquelle:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'pruefquelle-vorschlag')
    runs-on: ubuntu-latest
    steps:
      - name: Mark as a maintainer matter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMMER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh label create wartet-maintainer --repo "$REPO" --color FBCA04 \
            --description "Decision rests with the maintainer" || true
          gh issue edit "$NUMMER" --repo "$REPO" --add-label wartet-maintainer
